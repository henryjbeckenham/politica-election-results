contract_version: 2.0.0
design_system_version: 2.0.0
default_route: overview
read_only: true

routes:
  - route_id: overview
    title: Overview
    description: National election summary and interactive House composition.
    status: available
  - route_id: house
    title: House
    description: Election-specific electorate map, electorate results and candidate detail.
    status: available
  - route_id: senate
    title: Senate
    description: Full governed Senate composition, state delegations, group results, quotas, count-round progression, reported movements and declared outcomes.
    status: available
  - route_id: sources
    title: Sources
    description: Release identity, feed contracts and downloads.
    status: available
  - route_id: analytics
    title: Analysis
    description: House margins, AEC-reported TCP swings, closest contests, party movement and vote-to-seat comparisons.
    status: available
  - route_id: maps
    title: Maps
    description: Additional geographic comparison views planned after the governed 2025 House map.
    status: planned

filters:
  - filter_id: election
    title: Federal election
    parameter: election
    type: text
    default: ""
  - filter_id: state
    title: State or territory
    parameter: state
    type: enum
    values: [ALL, ACT, NSW, NT, QLD, SA, TAS, VIC, WA]
    default: ALL
  - filter_id: party
    title: Party
    parameter: party
    type: text
    default: ALL
  - filter_id: electorate
    title: Electorate
    parameter: electorate
    type: text
    default: ""
  - filter_id: search
    title: Search
    parameter: q
    type: text
    default: ""
  - filter_id: member
    title: Selected member
    parameter: member
    type: text
    default: ""
  - filter_id: chamber
    title: Chamber
    parameter: chamber
    type: enum
    values: [ALL, chamber_house, chamber_senate]
    default: ALL
  - filter_id: senate_state
    title: Senate state or territory
    parameter: senate_state
    type: enum
    values: [ACT, NSW, NT, QLD, SA, TAS, VIC, WA]
    default: NSW
  - filter_id: map_view
    title: House map view
    parameter: map_view
    type: enum
    values: [ALL, ACT, NSW, NT, QLD, SA, TAS, VIC, WA, SYDNEY, MELBOURNE, BRISBANE, ADELAIDE, PERTH, HOBART, CANBERRA, DARWIN]
    default: ALL

metrics:
  - metric_id: declared_house_seats
    title: Declared House seats
    unit: seats
    definition: Count of current declared House contest outcomes in the selected release.
    calculation: Count rows in house_seat_results after active filters.
    required_feeds: [house_seat_results]
  - metric_id: leading_house_party
    title: Leading House party
    unit: party
    definition: Party with the greatest number of current declared House seats.
    calculation: Maximum declared_seats in house_party_summary; ties use party name order.
    required_feeds: [house_party_summary]
  - metric_id: declared_senators
    title: Senators declared elected
    unit: people
    definition: Count of current Senate elected outcomes for this election, not the full continuing Senate.
    calculation: Count declared_members rows whose chamber is Senate.
    required_feeds: [declared_members]
  - metric_id: senate_membership_snapshot
    title: Senate representation view
    unit: seats
    definition: For 2025, all memberships in the governed 48th Parliament snapshot; for historical elections, the senators declared elected at that election without implying continuing membership not evidenced by the selected result.
    calculation: Count rows in senate_composition for the selected election; 2025 reconciles to 76 governed memberships, 2010, 2013, 2019 and 2022 each reconcile to 40 published elected senators, and the 2016 double-dissolution result reconciles to all 76 elected senators. The six 2013 Western Australian outcomes retain their later-voided status.
    required_feeds: [senate_composition]
  - metric_id: senate_state_delegation
    title: State Senate delegation
    unit: seats
    definition: State or territory representation in the selected governed Senate view.
    calculation: Count senate_composition rows by state and party; interpret 2010, 2013, 2016, 2019 and 2022 as published elected-at-election membership and 2025 as the complete governed snapshot.
    required_feeds: [senate_composition]
  - metric_id: senate_quota
    title: Senate quota
    unit: votes
    definition: Official quota reported in the current Senate distribution-of-preferences source.
    calculation: Use quota_value supplied with each senate_count_progress round; do not independently recalculate it.
    required_feeds: [senate_count_progress]
  - metric_id: senate_progressive_total
    title: Candidate progressive total
    unit: votes
    definition: A candidate's progressive total at a specified official count round.
    calculation: Use progressive_total from senate_count_progress for the selected state and round.
    required_feeds: [senate_count_progress]
  - metric_id: senate_count_movement
    title: Reported count movement
    unit: votes
    definition: Reported candidate gain, candidate loss or exhausted value in a specified distribution-of-preferences count.
    calculation: Use votes_value from senate_count_movements. Do not infer an unreported candidate-to-candidate origin and destination pair.
    required_feeds: [senate_count_movements]
  - metric_id: first_preference_share
    title: First-preference vote share
    unit: percentage
    definition: Party first-preference votes divided by all party first-preference votes in the reporting scope.
    calculation: Use first_preference_vote_share supplied by house_party_summary.
    required_feeds: [house_party_summary]
  - metric_id: winning_margin
    title: Winning margin
    unit: percentage points
    definition: Difference between the winning and second candidate shares in the governed TCP result when available.
    calculation: Use winning_margin_percentage_points supplied by house_seat_results.
    required_feeds: [house_seat_results]
  - metric_id: electorate_primary_vote
    title: Electorate primary vote
    unit: votes and percentage
    definition: Current total-vote first preferences for every candidate in a House contest.
    calculation: Use first_preference rows supplied by house_candidate_results.
    required_feeds: [house_candidate_results]
  - metric_id: electorate_tcp
    title: Electorate two-candidate preferred
    unit: votes and percentage
    definition: Current total-vote two-candidate-preferred result for a House contest.
    calculation: Use tcp rows supplied by house_candidate_results.
    required_feeds: [house_candidate_results]
  - metric_id: electorate_tpp
    title: Electorate two-party preferred
    unit: votes and percentage
    definition: Current ALP versus Coalition two-party-preferred result where reported for a House contest.
    calculation: Use tpp rows supplied by house_candidate_results; absence must be shown explicitly.
    required_feeds: [house_candidate_results]
  - metric_id: electorate_count_metadata
    title: Electorate count metadata
    unit: votes and percentage
    definition: Enrolment, formal votes, informal votes, votes counted, turnout and informality for a House contest.
    calculation: Use the governed participation fields joined into house_seat_results.
    required_feeds: [house_seat_results]
  - metric_id: electorate_boundary_coverage
    title: Governed electorate boundary coverage
    unit: divisions
    definition: Count of unique AEC federal electoral division features in the boundary contract applicable to the selected election.
    calculation: Count unique electorate properties in the selected checksum-pinned GeoJSON; 2025, 2016, 2013 and 2010 each reconcile to 150, while 2022 and 2019 each reconcile to 151, case-insensitively matching house_seat_results.
    required_feeds: []
  - metric_id: turnout
    title: Turnout
    unit: percentage
    definition: Formal and informal votes as a percentage of enrolled electors in the governed reporting unit.
    calculation: Use turnout_percentage rows supplied by turnout_informality.
    required_feeds: [turnout_informality]
  - metric_id: informality
    title: Informality
    unit: percentage
    definition: Informal votes as a percentage of ballot papers counted in the governed reporting unit.
    calculation: Use informality_percentage rows supplied by turnout_informality.
    required_feeds: [turnout_informality]
  - metric_id: reported_tcp_swing
    title: AEC-reported winner TCP swing
    unit: percentage points
    definition: TCP swing attached by the AEC source to the declared winning candidacy for the current contest.
    calculation: Use tcp_swing supplied by house_seat_results; do not recalculate it against redistributed historical boundaries.
    required_feeds: [house_seat_results]
  - metric_id: declared_seat_share
    title: Declared seat share
    unit: percentage
    definition: A party's declared House seats divided by all declared seats in the active analytical scope.
    calculation: Count house_seat_results by winning party and divide by the filtered declared-seat total.
    required_feeds: [house_seat_results]
  - metric_id: incumbent_based_movement
    title: Incumbent-based party movement
    unit: seats
    definition: Retained seats and gains or losses identifiable from governed candidate incumbency.
    calculation: Use seat_change_type and defeated_incumbent_party_name in house_seat_results; do not infer open-seat party transfers.
    required_feeds: [house_seat_results]
  - metric_id: average_winning_margin
    title: Average winning margin
    unit: percentage points
    definition: Arithmetic mean of available TCP winning margins in the selected state or territory.
    calculation: Average winning_margin_percentage_points across current house_seat_results in scope.
    required_feeds: [house_seat_results]

visualisations:
  - visualisation_id: house_composition
    title: House composition
    component: semicircle-chamber
    route_id: overview
    status: available
    required_feeds: [house_seat_results]
    metrics: [declared_house_seats]
    filters: [state, party, electorate, search, member]
    description: Every declared House electorate arranged in a party-grouped semicircle with selectable member detail.
  - visualisation_id: house_member_chamber
    title: House member chamber
    component: member-detail
    route_id: overview
    status: available
    required_feeds: [house_seat_results]
    metrics: [declared_house_seats]
    filters: [state, party, electorate, search, member]
    description: Keyboard-selectable member and electorate detail attached to the House composition diagram.
  - visualisation_id: house_party_result
    title: House party result
    component: ranked-bars
    route_id: overview
    status: available
    required_feeds: [house_party_summary]
    metrics: [first_preference_share]
    filters: [party]
    description: National first-preference share and declared seat totals.
  - visualisation_id: house_electorate_results
    title: House electorate results
    component: electorate-result-cards
    route_id: house
    status: available
    required_feeds: [house_seat_results, house_candidate_results]
    metrics: [winning_margin, electorate_primary_vote, electorate_tcp, electorate_tpp, electorate_count_metadata]
    filters: [state, party, electorate, search]
    description: Searchable result cards for all declared seats with winner status, primary votes, TCP, TPP and participation metadata.
  - visualisation_id: senate_group_result
    title: Senate group result
    component: ranked-bars
    route_id: senate
    status: available
    required_feeds: [senate_group_results]
    metrics: [first_preference_share]
    filters: [senate_state, party]
    description: Group first preferences in each Senate contest.
  - visualisation_id: senate_composition
    title: Senate representation
    component: semicircle-chamber
    route_id: senate
    status: available
    required_feeds: [senate_composition]
    metrics: [senate_membership_snapshot]
    filters: [state, senate_state, party, search, member]
    description: The complete governed 48th Parliament snapshot for 2025, or the senators published as elected in the selected historical result. The 2016 double-dissolution election includes all 76 declared senators; 2013, 2019 and 2022 each include 40. The 2013 Western Australian outcomes are explicitly marked as later voided.
  - visualisation_id: senate_member_chamber
    title: Senate member chamber
    component: member-detail
    route_id: senate
    status: available
    required_feeds: [senate_composition]
    metrics: [senate_membership_snapshot]
    filters: [state, senate_state, party, search, member]
    description: Selectable senator details including state, party, parliamentary bloc and term expiry.
  - visualisation_id: senate_declared_outcomes
    title: Senate declared outcomes
    component: member-list
    route_id: senate
    status: available
    required_feeds: [declared_members]
    metrics: [declared_senators]
    filters: [senate_state, party]
    description: Members declared elected at this election; continuing senators are outside this contract.
  - visualisation_id: senate_state_delegations
    title: State and territory Senate delegations
    component: delegation-cards
    route_id: senate
    status: available
    required_feeds: [senate_composition]
    metrics: [senate_state_delegation]
    filters: [senate_state, party, member]
    description: Eight selectable delegation cards reconcile the complete governed Senate snapshot by state, territory and party.
  - visualisation_id: senate_count_animation
    title: Senate count-round animation
    component: count-player
    route_id: senate
    status: available
    required_feeds: [senate_count_progress, senate_count_movements]
    metrics: [senate_quota, senate_progressive_total, senate_count_movement]
    filters: [senate_state]
    description: Accessible player for every official distribution-of-preferences count with previous, next, speed and direct-round controls.
  - visualisation_id: senate_quota_progress
    title: Candidate progress against quota
    component: quota-progress-bars
    route_id: senate
    status: available
    required_feeds: [senate_count_progress]
    metrics: [senate_quota, senate_progressive_total]
    filters: [senate_state]
    description: Candidate progressive totals, round changes, count status and a governed quota marker.
  - visualisation_id: senate_transfer_movements
    title: Reported Senate count movements
    component: signed-movement-flow
    route_id: senate
    status: available
    required_feeds: [senate_count_movements]
    metrics: [senate_count_movement]
    filters: [senate_state]
    description: Signed candidate inflows, outflows and exhausted values for the selected count without inventing unreported candidate-pair paths.
  - visualisation_id: senate_candidate_milestones
    title: Candidate election and exclusion timeline
    component: milestone-timeline
    route_id: senate
    status: available
    required_feeds: [senate_count_progress]
    metrics: [senate_progressive_total]
    filters: [senate_state]
    description: First reported elected and excluded status for each Senate candidate, ordered by count.
  - visualisation_id: senate_elected_timeline
    title: Declared elected-senator order
    component: elected-order-timeline
    route_id: senate
    status: available
    required_feeds: [declared_members]
    metrics: [declared_senators]
    filters: [senate_state, party]
    description: Official final elected-senator order for the selected state or territory.
  - visualisation_id: participation
    title: Turnout and informality
    component: ranked-bars
    route_id: overview
    status: available
    required_feeds: [turnout_informality]
    metrics: [turnout, informality]
    filters: [state, chamber]
    description: Governed turnout and informality percentages by reporting unit.
  - visualisation_id: source_evidence
    title: Source evidence and downloads
    component: evidence-panel
    route_id: sources
    status: available
    required_feeds: [house_candidate_results, house_seat_results, house_party_summary, senate_group_results, turnout_informality, declared_members, senate_count_progress, senate_count_movements, senate_composition]
    metrics: []
    filters: []
    description: Release identity and deterministic feed downloads.
  - visualisation_id: house_swing_analysis
    title: Largest reported House TCP swings
    component: signed-ranking
    route_id: analytics
    status: available
    required_feeds: [house_seat_results]
    metrics: [reported_tcp_swing]
    filters: [state, party, electorate, search]
    description: Ranks winner-level TCP swing values supplied by the AEC; this is not a historical redistribution calculation.
  - visualisation_id: electoral_pendulum
    title: Electoral pendulum
    component: margin-spectrum
    route_id: analytics
    status: available
    required_feeds: [house_seat_results]
    metrics: [winning_margin]
    filters: [state, party, electorate, search]
    description: All declared House seats ordered from the narrowest to the largest TCP winning margin.
  - visualisation_id: closest_contests
    title: Closest House contests
    component: selectable-ranking
    route_id: analytics
    status: available
    required_feeds: [house_seat_results]
    metrics: [winning_margin]
    filters: [state, party, electorate, search]
    description: The smallest governed TCP winning margins in the active analytical scope.
  - visualisation_id: party_gains_losses
    title: Party gains and losses
    component: movement-summary
    route_id: analytics
    status: available
    required_feeds: [house_seat_results]
    metrics: [incumbent_based_movement]
    filters: [state, party, electorate, search]
    description: Incumbent-based gains, losses and retentions; open seats remain explicitly labelled new member.
  - visualisation_id: vote_seat_comparison
    title: Vote share and seat share
    component: paired-share-bars
    route_id: analytics
    status: available
    required_feeds: [house_candidate_results, house_seat_results]
    metrics: [first_preference_share, declared_seat_share]
    filters: [state, party, electorate, search]
    description: Compares first-preference vote share with declared House seat share in the active scope.
  - visualisation_id: state_comparison
    title: State and territory comparison
    component: comparison-cards
    route_id: analytics
    status: available
    required_feeds: [house_seat_results]
    metrics: [declared_house_seats, average_winning_margin, turnout, incumbent_based_movement]
    filters: [state, party, electorate, search]
    description: State-level declared seats, average winning margin, average turnout and governed gains.
  - visualisation_id: vote_type_comparison
    title: Electorate vote-type comparison
    component: grouped-result-bars
    route_id: analytics
    status: available
    required_feeds: [house_candidate_results, house_seat_results]
    metrics: [electorate_primary_vote, electorate_tcp, electorate_tpp]
    filters: [state, party, electorate, search]
    description: First-preference, TCP and available TPP rows for the selected electorate.
  - visualisation_id: electorate_map
    title: Election-specific House electorate map
    component: accessible-svg-map
    route_id: house
    status: available
    required_feeds: [house_seat_results]
    metrics: [declared_house_seats, electorate_boundary_coverage, winning_margin]
    filters: [state, party, electorate, search, member, map_view]
    description: Every AEC federal electoral division applicable to the selected election, coloured by declared winner, with 40-times pointer-centred zoom, drag and keyboard pan, electorate focus, adaptive labels and eight selectable capital-city inset maps.
    interaction:
      zoom_range: [1, 40]
      zoom_inputs: [slider, buttons, mouse_wheel, trackpad, double_click, pinch, keyboard]
      pan_inputs: [pointer_drag, touch_drag, keyboard]
      focus_inputs: [map_selection, electorate_finder, selected_result]
      camera_persistence: current_browser_session
      inset_views: [SYDNEY, MELBOURNE, BRISBANE, ADELAIDE, PERTH, HOBART, CANBERRA, DARWIN]
      labels: adaptive_at_deep_zoom

accessibility:
  minimum_contrast: WCAG_AA
  keyboard_navigation: required
  non_colour_labels: required
  reduced_motion: supported
  tooltip_trigger_modes: [pointer, keyboard]

capability_boundaries:
  full_senate_composition: Available as a dated 48th Parliament snapshot; it must not be presented as live beyond its recorded as-at date without a new governed snapshot.
  physical_chamber_seating: Requires a separately governed seating-position source.
  historical_swing: AEC-reported 2025 TCP swing is available as supplied; independently recalculated cross-election swing still requires a compatible prior-election release and redistribution policy.
  house_seat_change: Retained and gained labels use governed candidate incumbency. Open-seat party transfers remain labelled new member until a governed prior-seat baseline is registered.
  electorate_maps: Checksum-pinned AEC national boundaries are governed separately for 2025, 2022, 2019, 2016 and 2013. Earlier elections require their own boundary contract and redistribution policy.
  senate_transfer_flows: The 2025 DOP supports reported round-level candidate gains, losses and exhaustion. Candidate-to-candidate paths must not be asserted because the source ingestion does not identify a unique origin candidate for every destination movement.

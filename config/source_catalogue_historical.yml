aph_endpoint_templates:
  baseline:
    - {key: aph_election, chamber: both, scope: election, endpoint: "Election?electionId={aph_election_id}"}
    - {key: aph_house_candidates, chamber: house, scope: election, endpoint: "Candidates?electionId={aph_election_id}"}
    - {key: aph_house_divisions, chamber: house, scope: election, endpoint: "Divisions?state=&year={year}"}
    - {key: aph_house_elected, chamber: house, scope: election, endpoint: "MembersElected?year={year}"}
    - {key: aph_senate_candidates, chamber: senate, scope: election, endpoint: "SenateCandidates?year={year}"}
    - {key: aph_senate_elected, chamber: senate, scope: election, endpoint: "SenatorsElected?year={year}"}
  state_cascade:
    - {key: aph_senate_state_statistics, chamber: senate, scope: state, endpoint: "SenateStateStatistics?state={state}&year={year}"}
    - {key: aph_senate_by_candidate, chamber: senate, scope: state, endpoint: "SenateByCandidate?state={state}&year={year}"}
    - {key: aph_senate_by_group, chamber: senate, scope: state, endpoint: "SenateByGroup?state={state}&year={year}"}
    - {key: aph_senate_group_quotas, chamber: senate, scope: state, endpoint: "SenateGroupQuotas?state={state}&year={year}"}
  division_cascade:
    - {key: aph_house_division_statistics, chamber: house, scope: division, endpoint: "DivisionStatistics?divisionName={division}&year={year}&electionId={aph_election_id}"}
    - {key: aph_house_first_preferences, chamber: house, scope: division, endpoint: "FirstPreferenceCount?divisionName={division}&year={year}&electionId={aph_election_id}"}
    - {key: aph_house_first_preferences_vote_type, chamber: house, scope: division, endpoint: "FirstPreferencesByVoteType?divisionName={division}&year={year}&electionId={aph_election_id}"}
    - {key: aph_house_polling_places, chamber: house, scope: division, endpoint: "PollingPlaces?divisionName={division}&year={year}&electionId={aph_election_id}"}
    - {key: aph_house_tcp, chamber: house, scope: division, endpoint: "TwoCandidatePreferred?divisionName={division}&year={year}&electionId={aph_election_id}"}
    - {key: aph_senate_by_division, chamber: senate, scope: division, endpoint: "SenateByDivision?division={division}&year={year}"}
  polling_place_cascade:
    - {key: aph_house_first_preferences_polling_place, chamber: house, scope: polling_place, endpoint: "FirstPreferencesByPollingPlace?pollingPlace={polling_place}&division={division}&year={year}&electionId={aph_election_id}"}
    - {key: aph_house_tcp_polling_place, chamber: house, scope: polling_place, endpoint: "TwoCandidatePreferredByPollingPlace?pollingPlace={polling_place}&division={division}&year={year}&electionId={aph_election_id}"}
    - {key: aph_senate_polling_place, chamber: senate, scope: polling_place, endpoint: "SenateByPollingPlace?pollingPlace={polling_place}&division={division}&year={year}&electionId={aph_election_id}"}


record_status:
  - [active, Active record]
  - [quarantined, Held from authoritative use]
  - [superseded, Replaced by a later record]
  - [withdrawn, Withdrawn by the authority or Politica governance]
  - [deleted_at_source, No longer present at the source]
publication_status:
  - [unpublished, Not publicly released]
  - [progressive, Progressive election-night or count update]
  - [provisional, Provisional official result]
  - [final, Final official result]
  - [amended, Corrected official publication]
  - [superseded, Replaced publication]
value_basis:
  - [official_reported, Value directly published by an authority]
  - [official_calculated, Value calculated and published by an authority]
  - [politica_calculated, Reproducible Politica calculation]
  - [transcribed, Manually transcribed official value]
  - [imputed, Modelled or inferred value]
value_status:
  - [reported, A value was published]
  - [not_applicable, Measure does not apply]
  - [not_published, Authority did not publish the measure]
  - [not_collected, Authority did not collect the measure]
  - [suppressed, Authority suppressed the value]
  - [pending, Awaiting a later official publication]
  - [parse_error, Source value could not be parsed]
match_status:
  - [matched, Canonical identity verified]

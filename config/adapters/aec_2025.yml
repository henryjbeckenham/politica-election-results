adapter_id: adapter_aec_2025_v1
authority_id: authority_aec
adapter_version: 1.8.0
status: implemented
encoding: utf-8-sig
delimiter: ","
election:
  election_id: election_fed_2025_05_03_general
  official_event_id: "31496"
  election_date: "2025-05-03"

datasets:
  house_candidates:
    filename_patterns: ["HouseCandidatesDownload-*.csv"]
    required_headers: [StateAb, DivisionID, DivisionNm, PartyAb, PartyNm, CandidateID, Surname, GivenNm, Elected]
    grain: one candidate in one House contest
    destination: core.candidacy
    dataset_family: election_bootstrap
    chamber_code: house
    geographic_scope: division
    mapping_entities: []
  house_elected:
    filename_patterns: ["HouseMembersElectedDownload-*.csv"]
    required_headers: [DivisionID, DivisionNm, CandidateID, GivenNm, Surname, PartyNm]
    grain: one elected member per House contest
    destination: results.contest_outcome
    dataset_family: outcomes
    chamber_code: house
    geographic_scope: division
    mapping_entities: []
  house_first_preferences_by_vote_type:
    filename_patterns: ["HouseFirstPrefsByCandidateByVoteTypeDownload-*.csv"]
    required_headers: [DivisionID, CandidateID, OrdinaryVotes, AbsentVotes, ProvisionalVotes, PrePollVotes, PostalVotes, TotalVotes]
    grain: one candidate and vote-type observation in one House contest after unpivot
    destination: results.vote_result
    dataset_family: first_preferences
    chamber_code: house
    geographic_scope: division
    mapping_entities: []
  house_first_preferences_by_polling_place:
    filename_patterns: ["HouseStateFirstPrefsByPollingPlaceDownload-31496-*.csv"]
    required_headers: [DivisionID, PollingPlaceID, CandidateID, OrdinaryVotes]
    grain: one candidate first-preference observation at one polling place
    destination: results.vote_result
  house_tcp_by_vote_type:
    filename_patterns: ["HouseTcpByCandidateByVoteTypeDownload-*.csv"]
    required_headers: [DivisionID, CandidateID, OrdinaryVotes, AbsentVotes, ProvisionalVotes, PrePollVotes, PostalVotes, TotalVotes]
    grain: one final-two candidate and vote-type observation after unpivot
    destination: results.vote_result
    dataset_family: two_candidate_preferred
    chamber_code: house
    geographic_scope: division
    mapping_entities: []
  house_tcp_by_polling_place:
    filename_patterns: ["HouseTcpByCandidateByPollingPlaceDownload-31496.csv"]
    required_headers: [DivisionID, PollingPlaceID, CandidateID, OrdinaryVotes]
    grain: one final-two candidate observation at one polling place
    destination: results.vote_result
  house_tpp_state:
    filename_patterns: ["HouseTppByStateDownload-31496.csv"]
    required_headers: [StateAb, StateNm, Australian Labor Party Votes, Australian Labor Party Percentage, Liberal/National Coalition Votes, Liberal/National Coalition Percentage, TotalVotes, Swing]
    grain: one official party-level two-party-preferred state or territory aggregate
    destination: results.vote_result
  house_tpp_division:
    filename_patterns: ["HouseTppByDivisionDownload-*.csv"]
    required_headers: [DivisionID, StateAb, PartyAb, Australian Labor Party Votes, Australian Labor Party Percentage, Liberal/National Coalition Votes, Liberal/National Coalition Percentage, TotalVotes, Swing]
    grain: one official party-level two-party-preferred division aggregate
    destination: results.vote_result
    dataset_family: two_party_preferred
    chamber_code: house
    geographic_scope: division
    mapping_entities: []
  house_tpp_division_vote_type:
    filename_patterns: ["HouseTppByDivisionByVoteTypeDownload-31496.csv"]
    required_headers: [DivisionID, StateAb, Australian Labor Party OrdinaryVotes, Liberal/National Coalition OrdinaryVotes, TotalVotes, Australian Labor Party DeclarationPrePollVotes, Liberal/National Coalition DeclarationPrePollVotes]
    grain: one official party-level two-party-preferred observation by division and vote type after unpivot
    destination: results.vote_result
  house_tpp_polling_place:
    filename_patterns: ["HouseTppByPollingPlaceDownload-31496.csv"]
    required_headers: [DivisionID, PollingPlaceID, Australian Labor Party Votes, Australian Labor Party Percentage, Liberal/National Coalition Votes, Liberal/National Coalition Percentage, TotalVotes, Swing]
    grain: one official party-level two-party-preferred observation at one polling place
    destination: results.vote_result
  house_distribution:
    filename_patterns: ["HouseDopByDivisionDownload-31496.csv"]
    required_headers: [DivisionID, CountNumber, CandidateID, CalculationType, CalculationValue]
    grain: one calculation type for one candidate at one House count
    destination: count.count_candidate_total
  polling_places:
    filename_patterns: ["GeneralPollingPlacesDownload-31496.csv"]
    required_headers: [DivisionID, PollingPlaceID, PollingPlaceTypeID, PollingPlaceNm]
    grain: one election-specific polling place in one House division
    destination: geography.election_reporting_unit
  enrolment_division:
    filename_patterns: ["GeneralEnrolmentByDivisionDownload-*.csv"]
    required_headers: [DivisionID, Enrolment]
    grain: one enrolled-elector total per division
    destination: results.participation_result
    dataset_family: enrolment
    chamber_code: house
    geographic_scope: division
    mapping_entities: []
  house_participation:
    filename_patterns: ["HouseInformalByDivisionDownload-*.csv", "HouseTurnoutByDivisionDownload-*.csv", "HouseVotesCountedByDivisionDownload-*.csv"]
    required_headers: [DivisionID]
    grain: one House participation summary per division
    destination: results.participation_result
    dataset_family: participation
    chamber_code: house
    geographic_scope: division
    mapping_entities: []
  senate_candidates:
    filename_patterns: ["SenateCandidatesDownload-*.csv"]
    required_headers: [StateAb, PartyAb, PartyNm, CandidateID, Surname, GivenNm, Elected]
    grain: one candidate in one Senate state or territory contest
    destination: core.candidacy
    dataset_family: election_bootstrap
    chamber_code: senate
    geographic_scope: state
    mapping_entities: []
  senate_elected:
    filename_patterns: ["SenateSenatorsElectedDownload-*.csv"]
    required_headers: [StateAb, GivenNm, Surname, PartyNm, ElectedOrder]
    grain: one elected senator in declared order
    destination: results.contest_outcome
    dataset_family: outcomes
    chamber_code: senate
    geographic_scope: state
    mapping_entities: []
  senate_first_preferences_state:
    filename_patterns: ["SenateFirstPrefsByStateByVoteTypeDownload-*.csv"]
    required_headers: [StateAb, Group, CandidateID, BallotPosition, CandidateDetails, OrdinaryVotes, TotalVotes]
    grain: one candidate or above-the-line group and vote-type observation after unpivot
    destination: results.vote_result
    dataset_family: first_preferences
    chamber_code: senate
    geographic_scope: state
    mapping_entities: []
  senate_first_preferences_division:
    filename_patterns: ["SenateFirstPrefsByDivisionByVoteTypeDownload-*.csv"]
    required_headers: [StateAb, DivisionID, Group, CandidateID, BallotPosition, OrdinaryVotes, TotalVotes]
    grain: one candidate or group and vote-type observation in one House division after unpivot
    destination: results.vote_result
    dataset_family: first_preferences
    chamber_code: senate
    geographic_scope: division
    mapping_entities: []
  senate_group_preferences_national:
    filename_patterns: ["SenateFirstPrefsByGroupByVoteTypeDownload-*.csv"]
    required_headers: [GroupAb, GroupNm, OrdinaryVotes, TotalVotes]
    grain: one national Senate source-group and vote-type observation after unpivot
    destination: results.vote_result
    dataset_family: first_preferences_group
    chamber_code: senate
    geographic_scope: national
    mapping_entities: []
  senate_group_preferences_state:
    filename_patterns: ["SenateFirstPrefsByStateByGroupByVoteTypeDownload-*.csv"]
    required_headers: [StateAb, GroupAb, GroupNm, OrdinaryVotes, TotalVotes]
    grain: one Senate source-group and vote-type observation in one state contest after unpivot
    destination: results.vote_result
    dataset_family: first_preferences_group
    chamber_code: senate
    geographic_scope: state
    mapping_entities: []
  senate_distribution:
    filename_patterns: ["SenateStateDOPDownload-*-*.csv"]
    required_headers: [State, Count, Ballot Position, Surname, GivenNm, Papers, VoteTransferred, ProgressiveVoteTotal]
    grain: one candidate total at one Senate count
    destination: count.count_candidate_total
    dataset_family: distribution_of_preferences
    chamber_code: senate
    geographic_scope: state
    mapping_entities: []
  senate_formal_preferences:
    filename_patterns: ["aec-senate-formalpreferences-*-*.csv"]
    required_headers: [State, Division, Vote Collection Point Name, Vote Collection Point ID, Batch No, Paper No]
    grain: one anonymous formal Senate ballot paper with an ordered counted preference path
    destination: ballot.ballot and ballot.ballot_preference
    dataset_family: formal_preferences
    chamber_code: senate
    geographic_scope: state
    mapping_entities: []
    physical_storage: partitioned Parquet by state, source revision and 250000-row shard
    selection_rule: below-the-line path when preferences 1-6 are valid; otherwise the valid above-the-line path
  enrolment_state:
    filename_patterns: ["GeneralEnrolmentByStateDownload-*.csv"]
    required_headers: [StateAb, Enrolment]
    grain: one enrolled-elector total per state or territory
    destination: results.participation_result
    dataset_family: enrolment
    chamber_code: senate
    geographic_scope: state
    mapping_entities: []
  senate_participation:
    filename_patterns: ["SenateInformalByStateDownload-*.csv", "SenateTurnoutByStateDownload-*.csv", "SenateVotesCountedByStateDownload-*.csv"]
    required_headers: [StateAb]
    grain: one Senate participation summary per state or territory
    destination: results.participation_result
    dataset_family: participation
    chamber_code: senate
    geographic_scope: state
    mapping_entities: []
  senate_participation_division:
    filename_patterns: ["SenateInformalByDivisionDownload-*.csv", "SenateTurnoutByDivisionDownload-*.csv", "SenateVotesCountedByDivisionDownload-*.csv"]
    required_headers: [DivisionID, StateAb]
    grain: one supplemental Senate participation reconciliation row per House division
    destination: results.participation_result
    dataset_family: participation
    chamber_code: senate
    geographic_scope: division
    mapping_entities: []

vote_type_columns:
  OrdinaryVotes: ordinary
  AbsentVotes: absent
  ProvisionalVotes: provisional
  PrePollVotes: early
  DeclarationPrePollVotes: early
  PostalVotes: postal
  TotalVotes: total

polling_place_types:
  "1": polling_place
  "2": mobile_team
  "3": remote_team
  "4": mobile_team
  "5": early_centre

unknown_schema_policy: quarantine
unknown_label_policy: quarantine
retain_source_native_fields: true

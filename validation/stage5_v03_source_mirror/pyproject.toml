[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "politica-stage5-sync"
version = "0.3.0"
description = "Bounded incremental runner for Politica Stage 5 Federal Register synchronisation"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
politica-stage5-sync = "politica_stage5_sync.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

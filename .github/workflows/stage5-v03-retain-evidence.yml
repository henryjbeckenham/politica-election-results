name: Retain Stage 5 v0.3 networked evidence

on:
  push:
    branches:
      - agent/stage5-v0-3-source-mirror-validation

permissions:
  actions: read
  contents: write

jobs:
  retain:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage5-v0-3-source-mirror-validation
      - name: Download and verify accepted evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation/stage5_v03_retained_evidence/download
          gh run download 30238236391 \
            --repo henryjbeckenham/politica-election-results \
            --name stage5-v03-source-mirror-networked-evidence \
            --dir validation/stage5_v03_retained_evidence/download
          cp validation/stage5_v03_retained_evidence/download/stage5-v03-source-mirror-networked-evidence.zip \
            validation/stage5_v03_retained_evidence/politica_stage5_v0_3_networked_validation_evidence.zip
          cp validation/stage5_v03_retained_evidence/download/stage5-v03-source-mirror-networked-evidence.sha256 \
            validation/stage5_v03_retained_evidence/politica_stage5_v0_3_networked_validation_evidence.sha256
          echo 'd73c4f157032fd1ec22c80f5c9d41ba8cacc01cec49df36875331db96967a500  validation/stage5_v03_retained_evidence/politica_stage5_v0_3_networked_validation_evidence.zip' | sha256sum -c -
      - name: Commit retained evidence to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf validation/stage5_v03_retained_evidence/download
          git config user.name 'Politica validation automation'
          git config user.email 'actions@users.noreply.github.com'
          git add validation/stage5_v03_retained_evidence
          git commit -m 'Retain Stage 5 v0.3 networked evidence [skip ci]'
          git push origin HEAD:agent/stage5-v0-3-source-mirror-validation

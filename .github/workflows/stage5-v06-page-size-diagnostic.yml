name: Stage 5 v0.6 500-row traversal diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and apply accepted corrections
        shell: bash
        run: |
          set -euo pipefail
          ROOT=validation/stage5_v06_full_reconciliation
          python "$ROOT/reconstruct_sources.py" --source "$ROOT/source" --output "$ROOT" --report "$ROOT/source_reconstruction.json"
          printf '%s  %s\n' '113eb6a92ac03556b380219208bac6ce1f9ba15093f1fd74bf35befdc1e94ccb' "$ROOT/apply_governed_baseline_correction.py" | sha256sum -c -
          python "$ROOT/apply_governed_baseline_correction.py"
          printf '%s  %s\n' '234ea20c8fff5b924eddbcdef125c1fee9ca248b1817845b662e9c4be598f47a' "$ROOT/apply_governed_duplicate_observation_patch.py" | sha256sum -c -
          python "$ROOT/apply_governed_duplicate_observation_patch.py"
      - name: Apply governed 500-row traversal revision
        shell: bash
        run: |
          set -euo pipefail
          ROOT=validation/stage5_v06_full_reconciliation
          sha256sum "$ROOT/apply_governed_page_size_patch.py" > "$ROOT/page_size_patch_script.sha256"
          sha256sum "$ROOT/apply_governed_page_size_test_patch.py" > "$ROOT/page_size_test_patch_script.sha256"
          python "$ROOT/apply_governed_page_size_patch.py"
          python "$ROOT/apply_governed_page_size_test_patch.py"
          python -m py_compile \
            "$ROOT/full_reconciliation.py" \
            "$ROOT/test_full_reconciliation.py" \
            "$ROOT/apply_governed_page_size_patch.py" \
            "$ROOT/apply_governed_page_size_test_patch.py"
          grep -E '^(PAGE_SIZE|REQUEST_CEILING|RULESET_VERSION) =' "$ROOT/full_reconciliation.py" > "$ROOT/page_size_runtime_constants.txt"
      - name: Run deterministic reconciliation tests
        shell: bash
        run: |
          set -euo pipefail
          ROOT=validation/stage5_v06_full_reconciliation
          set +e
          python -m unittest -v "$ROOT/test_full_reconciliation.py" > "$ROOT/page_size_unit_tests.stdout.log" 2> "$ROOT/page_size_unit_tests.stderr.log"
          code=$?
          set -e
          printf '%s\n' "$code" > "$ROOT/page_size_unit_tests.exit_code.txt"
          test "$code" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage5-v06-page-size-diagnostic
          path: |
            validation/stage5_v06_full_reconciliation/governed_page_size_patch.json
            validation/stage5_v06_full_reconciliation/governed_page_size_test_patch.json
            validation/stage5_v06_full_reconciliation/page_size_patch_script.sha256
            validation/stage5_v06_full_reconciliation/page_size_test_patch_script.sha256
            validation/stage5_v06_full_reconciliation/page_size_runtime_constants.txt
            validation/stage5_v06_full_reconciliation/page_size_unit_tests.*
          if-no-files-found: error
          retention-days: 90

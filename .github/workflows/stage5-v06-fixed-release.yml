name: Stage 5 v0.6 fixed diagnostic release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: stage5-v06-fixed-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RELEASE_TAG: stage5-v0.6-transfer-latest
    steps:
      - name: Wait for successful v5 reconciliation run on the same commit
        id: find
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 240); do
            run_json="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow 'Stage 5 v0.6 final full reconciliation v5' \
              --branch '${{ github.head_ref }}' \
              --limit 30 \
              --json databaseId,headSha,status,conclusion,createdAt)"
            run_id="$(python3 - <<'PY' "$run_json" "$TARGET_HEAD_SHA"
          import json,sys
          rows=json.loads(sys.argv[1]); sha=sys.argv[2]
          matches=[r for r in rows if r.get('headSha')==sha and r.get('status')=='completed' and r.get('conclusion')=='success']
          matches.sort(key=lambda r:r.get('createdAt',''), reverse=True)
          print(matches[0]['databaseId'] if matches else '')
          PY
            )"
            if test -n "$run_id"; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          echo 'No successful v5 reconciliation run was found for this commit.' >&2
          exit 1

      - name: Download exact accepted artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/package release/evidence
          gh run download '${{ steps.find.outputs.run_id }}' \
            --repo "$GITHUB_REPOSITORY" \
            --name politica-stage5-v0-6-source-package-v5 \
            --dir release/package
          gh run download '${{ steps.find.outputs.run_id }}' \
            --repo "$GITHUB_REPOSITORY" \
            --name politica-stage5-v0-6-full-reconciliation-evidence-v5 \
            --dir release/evidence
          (cd release/package && sha256sum --check politica_stage5_legislation_sync_v0_6.zip.sha256)
          (cd release/evidence && sha256sum --check politica_stage5_v0_6_full_reconciliation_evidence.zip.sha256)

      - name: Replace fixed diagnostic release
        shell: bash
        run: |
          set -euo pipefail
          gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_HEAD_SHA" \
            --title 'Politica Stage 5 v0.6 governed transfer' \
            --notes 'Fixed diagnostic transfer tag for the exact accepted Stage 5 v0.6 source package and full reconciliation evidence. This release is temporary transport only. The diagnostic branch must not be merged.' \
            --prerelease \
            release/package/politica_stage5_legislation_sync_v0_6.zip \
            release/package/politica_stage5_legislation_sync_v0_6.zip.sha256 \
            release/evidence/politica_stage5_v0_6_full_reconciliation_evidence.zip \
            release/evidence/politica_stage5_v0_6_full_reconciliation_evidence.zip.sha256 \
            release/package/package_result.json
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,name,isPrerelease,assets > release/fixed_release_manifest.json

      - name: Upload fixed-release manifest
        uses: actions/upload-artifact@v4
        with:
          name: politica-stage5-v0-6-fixed-release-manifest
          path: release/fixed_release_manifest.json
          retention-days: 90

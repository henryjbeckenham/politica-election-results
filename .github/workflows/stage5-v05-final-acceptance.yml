name: Stage 5 v0.5 final canonical integration acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      SOURCE: validation/stage5_v05_canonical_integration/source
      EVIDENCE: validation/stage5_v05_final_acceptance/evidence

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Execute governed Stage 5 v0.5 acceptance
        shell: bash
        run: |
          set -euo pipefail
          chmod +x validation/stage5_v05_final_acceptance/run_validation.sh
          validation/stage5_v05_final_acceptance/run_validation.sh

      - name: Package exact evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation/stage5_v05_final_acceptance/final
          (cd validation/stage5_v05_final_acceptance && zip -qr final/politica_stage5_v0_5_final_acceptance_evidence.zip evidence)
          sha256sum validation/stage5_v05_final_acceptance/final/politica_stage5_v0_5_final_acceptance_evidence.zip > validation/stage5_v05_final_acceptance/final/politica_stage5_v0_5_final_acceptance_evidence.zip.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: politica-stage5-v0-5-final-acceptance-evidence
          path: validation/stage5_v05_final_acceptance/final/
          if-no-files-found: error

name: Stage 5 v0.6 Federal Register source probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run governed read-only collection probe
        shell: bash
        run: |
          set -euo pipefail
          python validation/stage5_v06_full_reconciliation/probe.py \
            > validation/stage5_v06_full_reconciliation/probe_stdout.log \
            2> validation/stage5_v06_full_reconciliation/probe_stderr.log
          test ! -s validation/stage5_v06_full_reconciliation/probe_stderr.log
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('validation/stage5_v06_full_reconciliation/probe_evidence/probe_result.json')
          result = json.loads(path.read_text(encoding='utf-8'))
          assert result['status'] == 'completed'
          assert result['request_count'] <= result['request_ceiling']
          assert result['methods'] == ['GET']
          assert result['request_bodies'] == [None]
          PY

      - name: Package probe evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd validation/stage5_v06_full_reconciliation
          zip -qr stage5_v06_source_probe_evidence.zip probe_evidence probe_stdout.log probe_stderr.log
          sha256sum stage5_v06_source_probe_evidence.zip > stage5_v06_source_probe_evidence.zip.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage5-v06-source-probe-evidence
          path: |
            validation/stage5_v06_full_reconciliation/stage5_v06_source_probe_evidence.zip
            validation/stage5_v06_full_reconciliation/stage5_v06_source_probe_evidence.zip.sha256
          if-no-files-found: error

name: Stage 5 v0.6 final closure audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: stage5-v06-final-closure-audit
  cancel-in-progress: false

jobs:
  close_stage5:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ROOT: validation/stage5_v06_full_reconciliation
      SOURCE: validation/stage5_v05_canonical_integration/source
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Download governed retained inputs
        uses: actions/download-artifact@v4
        with:
          name: politica-stage5-v0-6-full-reconciliation-evidence
          path: retained/seed
          github-token: ${{ github.token }}
          repository: henryjbeckenham/politica-election-results
          run-id: 30337273845
      - name: Download governed Document partition plan
        uses: actions/download-artifact@v4
        with:
          name: stage5-v06-document-partition-plan
          path: retained/plan
          github-token: ${{ github.token }}
          repository: henryjbeckenham/politica-election-results
          run-id: 30355589699
      - name: Verify and extract retained inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/seed work/input
          cp retained/seed/politica_stage5_v0_6_full_reconciliation_evidence.zip work/input/cancelled_seed_evidence.zip
          cp -R retained/plan/document_partition_plan_evidence work/input/document_partition_plan_evidence
          unzip -t work/input/cancelled_seed_evidence.zip > work/input/cancelled_seed_zip_integrity.log
          unzip -q work/input/cancelled_seed_evidence.zip -d work/seed
          test -d work/seed/stage5_v0_6_full_reconciliation_evidence
          test -f work/input/document_partition_plan_evidence/document_partition_plan.json
          sha256sum work/input/cancelled_seed_evidence.zip work/input/document_partition_plan_evidence/document_partition_plan.json > work/input/governed_inputs.sha256
      - name: Checksum-gate closure sources and run unit tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$ROOT/closure_reconciliation.py")" = be0569ab937cba5ce21b8b666a19970e6ba06075
          test "$(git hash-object "$ROOT/test_closure_reconciliation.py")" = e9866659f0e32de64b248c9571ce06b0fd8b397f
          test "$(git hash-object "$ROOT/stage5_v06_closure_scope.json")" = 89482e054e27bfbd4f7220f07208a8160b24d119
          test "$(git hash-object "$ROOT/finalize_stage5.py")" = 6e8c933ac34cfa927bbc276743360a04ae604e17
          test "$(git hash-object "$ROOT/build_deterministic_zip.py")" = ace878144bf02e9b26d6740c21ddd1fd32ac0b62
          sha256sum "$ROOT/closure_reconciliation.py" "$ROOT/test_closure_reconciliation.py" "$ROOT/stage5_v06_closure_scope.json" "$ROOT/finalize_stage5.py" "$ROOT/build_deterministic_zip.py" > work/executable_inputs.sha256
          python -m py_compile "$ROOT/closure_reconciliation.py" "$ROOT/finalize_stage5.py" "$ROOT/build_deterministic_zip.py"
          set +e
          python -m unittest -v "$ROOT/test_closure_reconciliation.py" > work/closure_unit_tests.stdout.log 2> work/closure_unit_tests.stderr.log
          code=$?
          set -e
          printf '%s\n' "$code" > work/closure_unit_tests.exit_code.txt
          test "$code" -eq 0
      - name: Re-run accepted v0.5 exact PostgreSQL controls
        shell: bash
        env:
          EVIDENCE: ${{ github.workspace }}/work/v05
        run: |
          set -euo pipefail
          sed -n '1,98p;121,200p' validation/stage5_v05_final_acceptance/run_validation.sh > work/run_v05_postgres_only.sh
          printf '%s\n' 'echo STAGE5_V0_5_POSTGRES_CONTROLS_RECONFIRMED | tee "$EVIDENCE/postgres_reconfirmation_marker.txt"' >> work/run_v05_postgres_only.sh
          chmod +x work/run_v05_postgres_only.sh
          work/run_v05_postgres_only.sh
          test "$(cat work/v05/server_version_num.txt)" = 180004
          grep -q STAGE5_V0_5_POSTGRES_CONTROLS_RECONFIRMED work/v05/postgres_reconfirmation_marker.txt
      - name: Execute complete Stage 5 closure reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python "$ROOT/closure_reconciliation.py" live \
            --seed work/seed/stage5_v0_6_full_reconciliation_evidence \
            --document-plan work/input/document_partition_plan_evidence/document_partition_plan.json \
            --scope "$ROOT/stage5_v06_closure_scope.json" \
            --canonical-ids work/v05/reconciliation/canonical_ids.txt \
            --output work/closure
          test "$(python -c 'import json; print(json.load(open("work/closure/closure_reconciliation_result.json"))["status"])')" = passed
      - name: Replay closure without source access
        shell: bash
        run: |
          set -euo pipefail
          python "$ROOT/closure_reconciliation.py" replay --output work/closure --canonical-ids work/v05/reconciliation/canonical_ids.txt
          test "$(python -c 'import json; print(json.load(open("work/closure/replay/replay_result.json"))["status"])')" = passed
      - name: Run final Stage 5 acceptance and traceability audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/final
          python "$ROOT/finalize_stage5.py" \
            --v05-assessment "$ROOT/STAGE5_ACCEPTANCE_ASSESSMENT_V0_5.json" \
            --closure work/closure/closure_reconciliation_result.json \
            --replay work/closure/replay/replay_result.json \
            --unit-exit work/closure_unit_tests.exit_code.txt \
            --output work/final
          python - <<'PY'
          import json
          r=json.load(open('work/final/STAGE5_FINAL_ACCEPTANCE_ASSESSMENT_V0_6.json'))
          assert r['status']=='passed' and r['summary']=={'failed':0,'passed':30}
          print('STAGE5_V0_6_ALL_THIRTY_ACCEPTANCE_CRITERIA_PASS')
          PY
      - name: Build deterministic v0.6 package and closure evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/package_source work/evidence_source work/release
          cp "$ROOT/closure_reconciliation.py" "$ROOT/test_closure_reconciliation.py" "$ROOT/finalize_stage5.py" "$ROOT/build_deterministic_zip.py" "$ROOT/stage5_v06_closure_scope.json" work/package_source/
          cp work/final/* work/package_source/
          cp -R work/closure work/evidence_source/closure
          cp -R work/v05 work/evidence_source/v05_postgresql_acceptance
          cp -R work/input work/evidence_source/governed_inputs
          cp work/closure_unit_tests.* work/evidence_source/
          cp work/final/* work/evidence_source/
          sha256sum "$ROOT/closure_reconciliation.py" "$ROOT/test_closure_reconciliation.py" "$ROOT/finalize_stage5.py" "$ROOT/build_deterministic_zip.py" "$ROOT/stage5_v06_closure_scope.json" > work/package_source/source_files.sha256
          python "$ROOT/build_deterministic_zip.py" --source work/package_source --output work/release/politica_stage5_legislation_sync_v0_6.zip --prefix politica_stage5_legislation_sync_v0_6 > work/release/package_manifest.json
          python "$ROOT/build_deterministic_zip.py" --source work/package_source --output work/release/politica_stage5_legislation_sync_v0_6_repeat.zip --prefix politica_stage5_legislation_sync_v0_6 > work/release/package_repeat_manifest.json
          cmp work/release/politica_stage5_legislation_sync_v0_6.zip work/release/politica_stage5_legislation_sync_v0_6_repeat.zip
          rm work/release/politica_stage5_legislation_sync_v0_6_repeat.zip
          python "$ROOT/build_deterministic_zip.py" --source work/evidence_source --output work/release/politica_stage5_v0_6_closure_evidence.zip --prefix politica_stage5_v0_6_closure_evidence > work/release/evidence_manifest.json
          python "$ROOT/build_deterministic_zip.py" --source work/evidence_source --output work/release/politica_stage5_v0_6_closure_evidence_repeat.zip --prefix politica_stage5_v0_6_closure_evidence > work/release/evidence_repeat_manifest.json
          cmp work/release/politica_stage5_v0_6_closure_evidence.zip work/release/politica_stage5_v0_6_closure_evidence_repeat.zip
          rm work/release/politica_stage5_v0_6_closure_evidence_repeat.zip
          sha256sum work/release/*.zip > work/release/release_files.sha256
          printf '%s\n' STAGE5_V0_6_CLOSURE_EVIDENCE_PASS > work/release/closure_marker.txt
          printf '%s\n' STAGE5_STAGE_COMPLETE > work/release/stage_completion_marker.txt
      - uses: actions/upload-artifact@v4
        with:
          name: politica-stage5-v0-6-final-closure
          path: work/release/
          if-no-files-found: error
          retention-days: 90

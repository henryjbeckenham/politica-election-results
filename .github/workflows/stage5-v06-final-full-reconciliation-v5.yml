name: Stage 5 v0.6 final full reconciliation v5

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage5-v06-full-reconciliation-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    services:
      postgres184:
        image: postgres:18.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      RUN_ROOT: ${{ runner.temp }}/stage5_v06
      TRANSFER_BIN: politica-stage5-v06-7f3c2b9a4e1d
      NOTIFY_TOPIC: politica-stage5-v06-7f3c2b9a4e1d

    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client unzip zip

      - name: Execute exact Stage 5 v0.6 reconciliation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUN_ROOT"
          chmod +x validation/stage5_v06_full_reconciliation/run_workflow.sh
          validation/stage5_v06_full_reconciliation/run_workflow.sh \
            > >(tee -a "$RUN_ROOT/operator.log") \
            2> >(tee -a "$RUN_ROOT/operator.log" >&2)

      - name: Transfer accepted outputs and publish success manifest
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          base="https://filebin.net/${TRANSFER_BIN}"
          final="$RUN_ROOT/evidence/final"
          files=(
            "$final/politica_stage5_legislation_sync_v0_6.zip"
            "$final/politica_stage5_legislation_sync_v0_6.zip.sha256"
            "$final/politica_stage5_v0_6_full_reconciliation_evidence.zip"
            "$final/politica_stage5_v0_6_full_reconciliation_evidence.zip.sha256"
            "$final/package_result.json"
          )
          for file in "${files[@]}"; do
            test -f "$file"
            name="$(basename "$file")"
            curl --fail --show-error --silent --retry 3 --retry-all-errors \
              --upload-file "$file" \
              -H 'cid: Politica-Stage5-v0.6-governed-transfer' \
              "$base/$name" >/dev/null
          done
          mkdir -p "$RUN_ROOT/readback"
          for file in "${files[@]}"; do
            name="$(basename "$file")"
            curl --fail --show-error --silent --retry 3 --retry-all-errors --location \
              "$base/$name" -o "$RUN_ROOT/readback/$name"
            cmp "$file" "$RUN_ROOT/readback/$name"
          done
          (cd "$RUN_ROOT/readback" && sha256sum --check politica_stage5_legislation_sync_v0_6.zip.sha256)
          (cd "$RUN_ROOT/readback" && sha256sum --check politica_stage5_v0_6_full_reconciliation_evidence.zip.sha256)
          python3 - "$RUN_ROOT" "$base" "$GITHUB_RUN_ID" "$GITHUB_SHA" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); base=sys.argv[2]
          package=json.loads((root/'evidence/final/package_result.json').read_text())
          final=json.loads((root/'evidence/final_reconciliation_result.json').read_text())
          payload={
            'event':'STAGE5_V06_SUCCESS',
            'run_id':sys.argv[3],
            'head_sha':sys.argv[4],
            'package':package['source_package'],
            'evidence':package['evidence_archive'],
            'reconciliation':final['reconciliation'],
            'collection_results':final['collections'],
            's5_ac_019':'passed',
            's5_ac_030':'passed',
            'stage5_closed':True,
            'stage6_authorised':True,
            'urls':{
              'package':base+'/politica_stage5_legislation_sync_v0_6.zip',
              'package_sha256':base+'/politica_stage5_legislation_sync_v0_6.zip.sha256',
              'evidence':base+'/politica_stage5_v0_6_full_reconciliation_evidence.zip',
              'evidence_sha256':base+'/politica_stage5_v0_6_full_reconciliation_evidence.zip.sha256',
              'package_result':base+'/package_result.json',
            },
          }
          (root/'stage5_v06_success_notification.json').write_text(json.dumps(payload,sort_keys=True))
          PY
          curl --fail --show-error --silent --retry 3 --retry-all-errors \
            -H 'Title: STAGE5_V06_SUCCESS' \
            -H 'Priority: high' \
            -H 'Tags: white_check_mark,database' \
            -H 'Content-Type: application/json' \
            --data-binary "@$RUN_ROOT/stage5_v06_success_notification.json" \
            "https://ntfy.sh/${NOTIFY_TOPIC}" >/dev/null
          echo STAGE5_V0_6_TEMPORARY_TRANSFER_AND_NOTIFICATION_PASS

      - name: Publish failure context
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUN_ROOT"
          diagnostic="$RUNNER_TEMP/politica_stage5_v0_6_failure_diagnostic.zip"
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "head_sha=$GITHUB_SHA"
            echo "created_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$RUN_ROOT/failure_context.txt"
          (cd "$RUN_ROOT" && zip -qr "$diagnostic" .) || true
          if test -f "$diagnostic"; then
            sha256sum "$diagnostic" > "$diagnostic.sha256"
            base="https://filebin.net/${TRANSFER_BIN}"
            for file in "$diagnostic" "$diagnostic.sha256"; do
              name="$(basename "$file")"
              curl --fail --show-error --silent --retry 3 --retry-all-errors \
                --upload-file "$file" \
                -H 'cid: Politica-Stage5-v0.6-governed-transfer' \
                "$base/$name" >/dev/null || true
            done
          fi
          python3 - "$RUN_ROOT" "$GITHUB_RUN_ID" "$GITHUB_SHA" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          log=root/'operator.log'
          tail=''
          if log.exists():
            lines=log.read_text(errors='replace').splitlines()
            tail='\n'.join(lines[-120:])[-10000:]
          payload={
            'event':'STAGE5_V06_FAILURE',
            'run_id':sys.argv[2],
            'head_sha':sys.argv[3],
            'operator_log_tail':tail,
            'diagnostic_url':'https://filebin.net/politica-stage5-v06-7f3c2b9a4e1d/politica_stage5_v0_6_failure_diagnostic.zip',
            'diagnostic_sha256_url':'https://filebin.net/politica-stage5-v06-7f3c2b9a4e1d/politica_stage5_v0_6_failure_diagnostic.zip.sha256',
          }
          (root/'stage5_v06_failure_notification.json').write_text(json.dumps(payload,sort_keys=True))
          PY
          curl --fail --show-error --silent --retry 3 --retry-all-errors \
            -H 'Title: STAGE5_V06_FAILURE' \
            -H 'Priority: high' \
            -H 'Tags: x,warning' \
            -H 'Content-Type: application/json' \
            --data-binary "@$RUN_ROOT/stage5_v06_failure_notification.json" \
            "https://ntfy.sh/${NOTIFY_TOPIC}" >/dev/null || true

      - name: Upload accepted source package to Actions
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: politica-stage5-v0-6-source-package-v5
          path: |
            ${{ runner.temp }}/stage5_v06/evidence/final/politica_stage5_legislation_sync_v0_6.zip
            ${{ runner.temp }}/stage5_v06/evidence/final/politica_stage5_legislation_sync_v0_6.zip.sha256
            ${{ runner.temp }}/stage5_v06/evidence/final/package_result.json
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

      - name: Upload accepted evidence to Actions
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: politica-stage5-v0-6-full-reconciliation-evidence-v5
          path: |
            ${{ runner.temp }}/stage5_v06/evidence/final/politica_stage5_v0_6_full_reconciliation_evidence.zip
            ${{ runner.temp }}/stage5_v06/evidence/final/politica_stage5_v0_6_full_reconciliation_evidence.zip.sha256
            ${{ runner.temp }}/stage5_v06/evidence/final/package_result.json
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

      - name: Upload diagnostic evidence to Actions
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: politica-stage5-v0-6-diagnostic-failure-evidence-v5
          path: ${{ runner.temp }}/stage5_v06/
          compression-level: 6
          retention-days: 90
          if-no-files-found: warn

name: Stage 5 v0.5 canonical integration PostgreSQL validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-canonical-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      EVIDENCE: validation/stage5_v05_canonical_integration/evidence
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Retrieve, reconstruct and verify governed SQL inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE/sql" "$EVIDENCE/logs" "$EVIDENCE/source"
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib
          import json
          import os
          import urllib.parse
          import urllib.request

          evidence = Path(os.environ['EVIDENCE'])
          target = evidence / 'sql'
          source_target = evidence / 'source'
          token = os.environ['GH_TOKEN']
          repository = 'henryjbeckenham/politica-election-results'
          specs = {
              'stage3_full_domain_v0_10b.sql': {
                  'path': 'validation/stage5_v05_canonical_integration/source/stage3_full_domain_v0_10b.sql.gz.b64',
                  'ref': '679cbff1e0239836c9e3b984c20fbe9d508fd993',
                  'sha256': 'daab4b5f476d093fa975ebd93b72e941ab08e29b59519567ddddfc3caeb81fcc',
              },
              'stage5_canonical_live_fixture.sql': {
                  'path': 'validation/stage5_v05_canonical_integration/source/stage5_canonical_live_fixture.sql.gz.b64',
                  'ref': '0a86c8c7dd56a0e1d9f70295fbcd02c732f0be3f',
                  'sha256': '9e49589c98275493c83851bedb1b86ce617729c4daf53530a2db6e32666655a9',
              },
              'stage5_canonical_live_assertions.sql': {
                  'path': 'validation/stage5_v05_canonical_integration/source/stage5_canonical_live_assertions.sql.gz.b64',
                  'ref': '1564761b912f59b6de2dd84fa818f700f87a6768',
                  'sha256': 'ccc7ce4cb82bd7b3158d84a3516ceeb81d2315869bc72691886fbd7de0a260bd',
              },
          }
          report = {}
          for output_name, spec in specs.items():
              quoted_path = urllib.parse.quote(spec['path'], safe='/')
              url = f'https://api.github.com/repos/{repository}/contents/{quoted_path}?ref={spec["ref"]}'
              request = urllib.request.Request(
                  url,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'User-Agent': 'Politica-Stage5-v0.5-validation/1.0',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  metadata = json.loads(response.read().decode('utf-8'))
              encoded_file_bytes = base64.b64decode(metadata['content'])
              encoded = encoded_file_bytes.decode('ascii').strip()
              (source_target / f'{output_name}.gz.b64').write_text(encoded, encoding='ascii')
              compressed = base64.b64decode(encoded, validate=True)
              decoded = gzip.decompress(compressed)
              actual_sha = hashlib.sha256(decoded).hexdigest()
              if actual_sha != spec['sha256']:
                  raise SystemExit(f'SHA-256 mismatch for {output_name}: {actual_sha}')
              (target / output_name).write_bytes(decoded)
              report[output_name] = {
                  'contents_api_url': url,
                  'git_blob_sha': metadata['sha'],
                  'encoded_bytes': len(encoded),
                  'decoded_bytes': len(decoded),
                  'sha256': actual_sha,
              }
          (evidence / 'input_reconstruction.json').write_text(
              json.dumps(report, indent=2, sort_keys=True), encoding='utf-8'
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
          sha256sum "$EVIDENCE/sql/stage3_full_domain_v0_10b.sql" | tee "$EVIDENCE/schema.sha256"
          sha256sum "$EVIDENCE/sql/stage5_canonical_live_fixture.sql" | tee "$EVIDENCE/fixture.sha256"
          sha256sum "$EVIDENCE/sql/stage5_canonical_live_assertions.sql" | tee "$EVIDENCE/assertions.sha256"

      - name: Execute exact PostgreSQL 18.4 validation
        shell: bash
        run: |
          set -euo pipefail
          server_version_num="$(psql -Atc 'SHOW server_version_num')"
          echo "$server_version_num" | tee "$EVIDENCE/server_version_num.txt"
          test "$server_version_num" = "180004"
          for sql in stage3_full_domain_v0_10b.sql stage5_canonical_live_fixture.sql stage5_canonical_live_assertions.sql; do
            if psql -v ON_ERROR_STOP=1 -f "$EVIDENCE/sql/$sql" > "$EVIDENCE/logs/$sql.stdout.log" 2> "$EVIDENCE/logs/$sql.stderr.log"; then
              echo 0 > "$EVIDENCE/logs/$sql.exit_code.txt"
            else
              code=$?
              echo "$code" > "$EVIDENCE/logs/$sql.exit_code.txt"
              cat "$EVIDENCE/logs/$sql.stderr.log" >&2
              exit "$code"
            fi
          done
          grep -q 'STAGE5_CANONICAL_LIVE_POSTGRES_PASS' "$EVIDENCE/logs/stage5_canonical_live_assertions.sql.stdout.log"
          echo 'STAGE5_V0_5_CANONICAL_INTEGRATION_COMPLETED' | tee "$EVIDENCE/completion_marker.txt"

      - name: Capture canonical snapshot
        shell: bash
        run: |
          set -euo pipefail
          psql -At -F $'\t' -c "SELECT 'legislation_titles', count(*) FROM bls_legislation.legislation_titles UNION ALL SELECT 'legislation_status_history', count(*) FROM bls_legislation.legislation_status_history UNION ALL SELECT 'legislation_versions', count(*) FROM bls_legislation.legislation_versions UNION ALL SELECT 'legislation_documents', count(*) FROM bls_legislation.legislation_documents UNION ALL SELECT 'departments', count(*) FROM bls_legislation.departments UNION ALL SELECT 'scrutiny_events', count(*) FROM bls_legislation.scrutiny_events UNION ALL SELECT 'field_provenance', count(*) FROM bls_audit.field_provenance UNION ALL SELECT 'record_evidence', count(*) FROM bls_source.record_evidence ORDER BY 1" > "$EVIDENCE/canonical_counts.tsv"
          psql -At -F $'\t' -c "SELECT d.document_format_source_value, d.page_count, d.source_size_in_bytes, d.is_authorised FROM bls_legislation.legislation_documents d ORDER BY d.document_format_source_value" > "$EVIDENCE/document_snapshot.tsv"
          psql -At -F $'\t' -c "SELECT s.source_status_value, lower(s.status_period), upper(s.status_period) FROM bls_legislation.legislation_status_history s ORDER BY lower(s.status_period)" > "$EVIDENCE/status_snapshot.tsv"

      - name: Package evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation/stage5_v05_canonical_integration/final
          (cd validation/stage5_v05_canonical_integration && zip -qr final/stage5-v05-canonical-integration-evidence.zip evidence)
          sha256sum validation/stage5_v05_canonical_integration/final/stage5-v05-canonical-integration-evidence.zip > validation/stage5_v05_canonical_integration/final/stage5-v05-canonical-integration-evidence.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage5-v05-canonical-integration-evidence
          path: validation/stage5_v05_canonical_integration/final/
          if-no-files-found: error

name: Stage 5 v0.6 terminal status labels

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: stage5-v06-status-labels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number || '13' }}
    steps:
      - name: Wait for terminal v5 reconciliation run on the same commit
        id: terminal
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 240); do
            run_json="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow 'Stage 5 v0.6 final full reconciliation v5' \
              --branch '${{ github.head_ref }}' \
              --limit 30 \
              --json databaseId,headSha,status,conclusion,createdAt)"
            terminal="$(python3 - <<'PY' "$run_json" "$TARGET_HEAD_SHA"
          import json,sys
          rows=json.loads(sys.argv[1]); sha=sys.argv[2]
          matches=[r for r in rows if r.get('headSha')==sha and r.get('status')=='completed']
          matches.sort(key=lambda r:r.get('createdAt',''), reverse=True)
          if matches:
              row=matches[0]
              print(f"{row['databaseId']}|{row.get('conclusion') or ''}")
          PY
            )"
            if test -n "$terminal"; then
              run_id="${terminal%%|*}"
              conclusion="${terminal#*|}"
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          echo 'No terminal v5 run found for the current head commit.' >&2
          exit 1

      - name: Replace previous Stage 5 v0.6 status labels
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')"
          while IFS= read -r label; do
            case "$label" in
              stage5-v06-result-*|stage5-v06-runbit-*|stage5-v06-runwidth-*)
                gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$label" || true
                ;;
            esac
          done <<< "$existing"

      - name: Add conclusion and run-id bit labels
        shell: bash
        run: |
          set -euo pipefail
          conclusion='${{ steps.terminal.outputs.conclusion }}'
          run_id='${{ steps.terminal.outputs.run_id }}'
          result_label="stage5-v06-result-${conclusion}"
          gh label create "$result_label" --repo "$GITHUB_REPOSITORY" --color 5319e7 --force
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "$result_label"
          width=40
          width_label="stage5-v06-runwidth-${width}"
          gh label create "$width_label" --repo "$GITHUB_REPOSITORY" --color 0e8a16 --force
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "$width_label"
          for bit in $(seq 0 $((width-1))); do
            if (( (run_id >> bit) & 1 )); then
              label="stage5-v06-runbit-$(printf '%02d' "$bit")"
              gh label create "$label" --repo "$GITHUB_REPOSITORY" --color c5def5 --force
              gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "$label"
            fi
          done
          echo "Stage 5 v0.6 terminal run ${run_id}: ${conclusion}"

name: Stage 14.7D probe 2025 sources

on:
  push:
    branches:
      - agent/stage14-7d-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML
      - run: python scripts/stage14_7d_probe_2025_sources.py | tee STAGE_14_7D_2025_SOURCE_PROBE.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: stage14-7d-2025-source-probe
          path: STAGE_14_7D_2025_SOURCE_PROBE.tsv
          if-no-files-found: error
          retention-days: 7
